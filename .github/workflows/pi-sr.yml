name: pi-sr (Node)

on:
  push:
    tags:
      - 'pi-sr-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., pi-sr-v1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
      - run: npm run build
      - name: Package pi-sr (Node bundle, reliable)
        run: |
          set -euo pipefail
          mkdir -p release-assets/pi-sr
          cp -R packages/coding-agent/dist/bundle release-assets/pi-sr/
          cat > release-assets/pi-sr/pi-sr << 'EOS'
          #!/usr/bin/env sh
          exec node "$(dirname "$0")/bundle/cli.js" "$@"
          EOS
          chmod +x release-assets/pi-sr/pi-sr
          cd release-assets
          tar -czf "pi-sr-${{ env.RELEASE_TAG }}.tar.gz" pi-sr
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: pi-sr-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-sr-${{ env.RELEASE_TAG }}
          path: release-assets
      - run: |
          set -euo pipefail
          cd release-assets
          gh release create "${RELEASE_TAG}" --draft --title "${RELEASE_TAG}" --notes "pi-sr self-recursive version (Node bundle). Install: curl -fsSL https://github.com/duggal1/pi-self-recursive/releases/${RELEASE_TAG}/download/pi-sr-${RELEASE_TAG}.tar.gz -o /tmp/pi-sr.tgz && tar -xz -C ~/.pi-sr-app -f /tmp/pi-sr.tgz --strip-components=1" ./* || gh release upload "${RELEASE_TAG}" ./* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
